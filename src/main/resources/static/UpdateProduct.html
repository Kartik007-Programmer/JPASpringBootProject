<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Product</title>
    <style>
        :root {
            --primary: #f59e0b; /* Warning/Edit Yellow */
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #1e293b;
        }

        body {
            font-family: 'Inter', system-ui, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            background: var(--card);
            padding: 35px;
            border-radius: 20px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 480px;
        }

        h2 { text-align: center; margin-bottom: 25px; font-weight: 800; }

        .preview-container {
            width: 100%;
            height: 180px;
            background: #f8fafc;
            border: 2px dashed #e2e8f0;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .preview-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        label {
            display: block;
            font-size: 0.85rem;
            font-weight: 700;
            margin-bottom: 6px;
            color: #64748b;
            text-transform: uppercase;
        }

        input, textarea {
            width: 100%;
            padding: 12px;
            margin-bottom: 18px;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            box-sizing: border-box;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(245, 158, 11, 0.1);
        }

        .btn-save {
            width: 100%;
            padding: 14px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-save:hover { background: #d97706; }

        .back-link {
            display: block;
            text-align: center;
            margin-top: 20px;
            text-decoration: none;
            color: #64748b;
            font-weight: 600;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

<div class="container">
    <a href="" onclick="location.href=document.referrer; return false;" class="back-link" style="text-align: left; margin-bottom: 15px;">← Back to List</a>
    <h2>Update Product</h2>

    <form id="updateForm">
        <label>Current Image</label>
        <div class="preview-container" id="imagePreview">
            <span>Loading image...</span>
        </div>

        <label>Change Image (Optional)</label>
        <input type="file" id="imageFile" accept="image/*" onchange="handleFileSelect(event)">

        <label>Product Name</label>
        <input type="text" id="name" required>

        <label>Price (₹)</label>
        <input type="number" id="price" step="0.01" required>

        <label>Description</label>
        <textarea id="description" rows="3"></textarea>

        <label>Quantity</label>
        <input type="number" id="quantity" required>

        <button type="submit" class="btn-save">Save Changes</button>
    </form>
    <div id="statusMsg" style="text-align: center; margin-top: 15px;"></div>
</div>

<script>
    const params = new URLSearchParams(window.location.search);
    const productId = params.get('id');
    const updateForm = document.getElementById('updateForm');
    const statusMsg = document.getElementById('statusMsg');

    // 1. Load existing data when the page opens
    if (productId) {
        fetch(`http://localhost:8080/products/${productId}`)
            .then(res => res.json())
            .then(data => {
                document.getElementById('name').value = data.name;
                document.getElementById('price').value = data.price;
                document.getElementById('description').value = data.description || '';
                document.getElementById('quantity').value = data.quantity;

                if (data.imageName) {
                    document.getElementById('imagePreview').innerHTML =
                        `<img src="http://localhost:8080/${data.id}/image">`;
                } else {
                    document.getElementById('imagePreview').innerHTML = "<span>No Image Set</span>";
                }
            })
            .catch(err => {
                statusMsg.innerHTML = "<span style='color:red'>Error loading product data.</span>";
            });
    }

    // 2. Preview new image selection locally
    function handleFileSelect(event) {
        const reader = new FileReader();
        reader.onload = function() {
            const output = document.getElementById('imagePreview');
            output.innerHTML = `<img src="${reader.result}">`;
        }
        reader.readAsDataURL(event.target.files[0]);
    }

    // 3. Submit the Update using FormData
    updateForm.addEventListener('submit', function(e) {
        e.preventDefault();

        const formData = new FormData();

        const product = {
            name: document.getElementById('name').value,
            price: document.getElementById('price').value,
            description: document.getElementById('description').value,
            quantity: document.getElementById('quantity').value
        };

        formData.append("product", new Blob([JSON.stringify(product)], { type: "application/json" }));

        const fileInput = document.getElementById('imageFile');
        if (fileInput.files[0]) {
            formData.append("imagefile", fileInput.files[0]);
        }

        fetch(`http://localhost:8080/products/${productId}`, {
            method: "PUT",
            body: formData
        })
        .then(res => {
            if (res.ok) {
                alert("Updated successfully");
            } else {
                alert("Update failed");
            }
        });
    });

     window.addEventListener("pageshow", function (event) {
        if(event.persisted){
            window.location.reload();
        }
    });

</script>

</body>
</html>
